[package]
edition = "2024"
name = "fabric-lib"
version = "0.0.0"
publish = false

[features]
default = []
tokio = ["dep:tokio", "tokio/sync", "tokio/rt-multi-thread"]

[dependencies]
libfabric-sys = { git = "https://github.com/perplexityai/pplx-garden", rev = "1ed972ed3f0bd5616c997c9507c25616c63394fc" }
libibverbs-sys = { git = "https://github.com/perplexityai/pplx-garden", rev = "1ed972ed3f0bd5616c997c9507c25616c63394fc" }

cuda-lib = { git = "https://github.com/perplexityai/pplx-garden", rev = "1ed972ed3f0bd5616c997c9507c25616c63394fc" }
thread-lib = { git = "https://github.com/perplexityai/pplx-garden", rev = "1ed972ed3f0bd5616c997c9507c25616c63394fc" }

anyhow = { version = "1.0.100", features = ["backtrace"] }
bytes = { version = "1.10.1", features = ["serde"] }
crossbeam-channel = "0.5.15"
dashmap = { version = "6.1.0", features = ["inline"] }
libc = "0.2"
once_cell = "1.21.3"
oneshot = "0.1.11"
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
smallvec = { version = "1.15.1", features = ["serde", "union"] }
thiserror = "2.0.17"
tracing = "0.1.41"
syscalls = "0.7.0"
mockall = "0.13.1"

# Optional dependencies
tokio = { version = "1.48.0", optional = true }

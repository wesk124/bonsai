[package]
name = "bonsai-py"
description = "PyO3 bindings: lets HF Transformers prefill/decode workers drive the Bonsai data plane."
edition = "2024"
version = "0.1.0"
publish = false

[lib]
name = "bonsai"
crate-type = ["cdylib"]

[features]
default = ["fabric"]
fabric = ["bonsai-transport/fabric"]
cuda = []

[dependencies]
bonsai-core = { path = "../bonsai-core" }
bonsai-transport = { path = "../bonsai-transport" }
pyo3 = { version = "0.27", features = ["extension-module", "anyhow"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "time", "net"] }

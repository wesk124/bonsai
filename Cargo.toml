[workspace]
resolver = "2"
members = [
  "crates/bonsai-core",
  "crates/bonsai-codec",
  "crates/bonsai-transport",
  "crates/bonsai-dataplane",
  "crates/bonsai-control",
]
# PyO3 bindings need a Python + torch toolchain; built separately with maturin.
exclude = ["crates/bonsai-py"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
bonsai-core = { path = "crates/bonsai-core" }
bonsai-codec = { path = "crates/bonsai-codec" }
bonsai-transport = { path = "crates/bonsai-transport" }
bonsai-dataplane = { path = "crates/bonsai-dataplane" }
bonsai-control = { path = "crates/bonsai-control" }

# Perplexity fabric-lib (RDMA TransferEngine). Only pulled in with the `fabric` feature,
# because it needs libfabric / libibverbs / CUDA / GDRCopy at build time (Linux only).
fabric-lib = { git = "https://github.com/perplexityai/pplx-garden", package = "fabric-lib", rev = "1ed972ed3f0bd5616c997c9507c25616c63394fc", features = ["tokio"] }
cuda-lib = { git = "https://github.com/perplexityai/pplx-garden", package = "cuda-lib", rev = "1ed972ed3f0bd5616c997c9507c25616c63394fc" }

anyhow = "1.0"
bytes = { version = "1.10", features = ["serde"] }
futures = "0.3"
parking_lot = "0.12"
postcard = { version = "1.1", features = ["alloc", "use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tracing = "0.1"
